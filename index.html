<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Podcast Pro - Multitrack</title>
    <style>
        :root {
            --bg-main: #121212;
            --bg-panel: #1e1e1e;
            --bg-track: #2a2a2a;
            --border: #333;
            --accent: #4caf50;
            --clip-bg: #2d8630;
            --clip-border: #4caf50;
            --text: #fff;
            --track-height: 110px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, sans-serif;
            background: var(--bg-main);
            color: var(--text);
            margin: 0;
            padding: 15px;
            user-select: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5em;
        }

        .toolbar {
            display: flex;
            gap: 15px;
            align-items: center;
            background: var(--bg-panel);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .btn {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn:hover {
            background: #444;
        }

        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }

        .btn.danger {
            background: #e74c3c;
            border-color: #c0392b;
        }

        .time-display {
            font-family: monospace;
            font-size: 1.4em;
            background: #000;
            padding: 5px 15px;
            border-radius: 4px;
            color: var(--accent);
            border: 1px solid #333;
        }

        .vu-meter-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #000;
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #333;
        }

        #vu-meter {
            background: #111;
            width: 100px;
            height: 15px;
            border-radius: 2px;
        }

        .workspace {
            display: flex;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #151515;
            height: 500px;
            overflow-y: auto;
            position: relative;
        }

        .track-headers-container {
            width: 220px;
            flex-shrink: 0;
            position: sticky;
            left: 0;
            z-index: 30;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .track-headers-spacer {
            height: 30px;
            border-bottom: 1px solid var(--border);
            background: #1a1a1a;
            display: flex;
            align-items: center;
            padding-left: 10px;
            font-size: 11px;
            color: #888;
        }

        .timeline-container {
            flex-grow: 1;
            overflow-x: auto;
            position: relative;
            background: var(--bg-dark);
        }

        .time-ruler {
            height: 30px;
            background: #1a1a1a;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 25;
            cursor: crosshair;
        }

        .track-header {
            height: var(--track-height);
            border-bottom: 1px solid var(--border);
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #222;
        }

        .track-title {
            font-weight: bold;
            font-size: 13px;
            color: #ddd;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        .track-controls {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .t-btn {
            background: #444;
            border: none;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .t-btn.active {
            background: var(--accent);
            color: #000;
        }

        .t-btn.mute-active {
            background: #e74c3c;
            color: white;
        }

        .vol-slider {
            width: 100%;
            cursor: pointer;
            margin-top: 5px;
        }

        .btn-import {
            background: #333;
            border: 1px dashed #666;
            color: white;
            padding: 4px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            text-align: center;
            margin-top: 5px;
        }

        .tracks-area {
            position: relative;
            min-width: 100%;
            min-height: calc(100% - 30px);
        }

        .track-lane {
            height: var(--track-height);
            border-bottom: 1px solid var(--border);
            position: relative;
            background: var(--bg-track);
        }

        .track-lane::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 100%;
            pointer-events: none;
        }

        .audio-clip {
            position: absolute;
            top: 5px;
            height: calc(var(--track-height) - 10px);
            background: var(--clip-bg);
            border: 1px solid var(--clip-border);
            border-radius: 4px;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: grab;
        }

        .audio-clip.selected {
            border: 2px solid #fff;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
            z-index: 10;
        }

        .audio-clip:active {
            cursor: grabbing;
        }

        .clip-name {
            position: absolute;
            top: 4px;
            left: 8px;
            font-size: 11px;
            font-weight: bold;
            z-index: 3;
            text-shadow: 1px 1px 2px #000;
            pointer-events: none;
        }

        .clip-waveform {
            position: absolute;
            top: 0;
            bottom: 0;
            pointer-events: none;
            opacity: 0.9;
            height: 100%;
            transform-origin: center;
        }

        /* Gain & Trims & Fades */
        .clip-gain-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 6px;
            background: rgba(255, 255, 255, 0.5);
            cursor: ns-resize;
            z-index: 15;
            transform: translateY(-3px);
        }

        .clip-gain-line:hover {
            background: rgba(255, 255, 255, 0.9);
            height: 8px;
            transform: translateY(-4px);
        }

        .handle-trim {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 10px;
            background: rgba(255, 255, 255, 0.1);
            cursor: ew-resize;
            z-index: 5;
        }

        .handle-trim:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .handle-trim.left {
            left: 0;
            border-right: 1px solid rgba(0, 0, 0, 0.3);
        }

        .handle-trim.right {
            right: 0;
            border-left: 1px solid rgba(0, 0, 0, 0.3);
        }

        .handle-fade {
            position: absolute;
            top: 0;
            width: 16px;
            height: 16px;
            cursor: pointer;
            z-index: 6;
        }

        .handle-fade::after {
            content: '';
            position: absolute;
            top: 0;
            border-top: 16px solid #f1c40f;
        }

        .handle-fade.left {
            left: 0;
        }

        .handle-fade.left::after {
            left: 0;
            border-right: 16px solid transparent;
        }

        .handle-fade.right {
            right: 0;
        }

        .handle-fade.right::after {
            right: 0;
            border-left: 16px solid transparent;
        }

        /* Correction des courbes de fondu */
        .fade-poly {
            position: absolute;
            top: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            pointer-events: none;
            z-index: 4;
        }

        .fade-poly.left {
            left: 0;
            clip-path: polygon(0 0, 0 100%, 100% 0);
        }

        /* Ramps UP */
        .fade-poly.right {
            right: 0;
            clip-path: polygon(0 0, 100% 0, 100% 100%);
        }

        /* Ramps DOWN */

        .playhead {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #e74c3c;
            left: 0;
            z-index: 20;
            pointer-events: none;
        }

        .playhead::before {
            content: '';
            position: absolute;
            top: -8px;
            left: -6px;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 8px solid #e74c3c;
        }

        .add-track-btn {
            padding: 15px;
            text-align: center;
            background: #222;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            color: #888;
            font-weight: bold;
        }

        .add-track-btn:hover {
            background: #333;
            color: white;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🎙️ Studio Podcast Pro</h1>
        <div class="toolbar">
            <div class="time-display" id="time-display">00:00.0</div>
            <button class="btn primary" id="btn-play">▶ Lecture</button>
            <button class="btn" id="btn-pause">⏸ Pause</button>
            <button class="btn" id="btn-stop">⏹ Stop</button>

            <div class="vu-meter-box" title="Master Out">
                <span style="font-size: 10px; color: #888;">MASTER</span>
                <canvas id="vu-meter"></canvas>
            </div>
            <button class="btn danger" id="btn-export">💾 Exporter WAV</button>
        </div>
    </div>

    <div class="workspace" id="workspace">
        <div class="track-headers-container">
            <div class="track-headers-spacer">Contrôles</div>
            <div id="track-headers"></div>
            <div class="add-track-btn" id="btn-add-track">+ Ajouter une piste</div>
        </div>

        <div class="timeline-container" id="timeline-container">
            <div class="time-ruler" id="ruler"></div>
            <div class="tracks-area" id="tracks-area">
                <div class="playhead" id="playhead"></div>
                <!-- Track lanes generated by JS -->
            </div>
        </div>
    </div>

    <input type="file" id="file-input" accept="audio/*" style="display: none;">

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx, masterGain, analyser;

        const state = {
            pixelsPerSecond: 50,
            isPlaying: false,
            playbackStartTime: 0,
            pauseTime: 0,
            clips: [],
            tracks: [
                { id: 't0', name: 'Voix 1', volume: 1, muted: false, solo: false, gainNode: null },
                { id: 't1', name: 'Voix 2', volume: 1, muted: false, solo: false, gainNode: null },
                { id: 't2', name: 'Ambiance', volume: 0.8, muted: false, solo: false, gainNode: null }
            ],
            selectedClipId: null,
            animationId: null
        };

        const DOM = {
            headers: document.getElementById('track-headers'),
            tracksArea: document.getElementById('tracks-area'),
            ruler: document.getElementById('ruler'),
            playhead: document.getElementById('playhead'),
            timeDisplay: document.getElementById('time-display'),
            fileInput: document.getElementById('file-input'),
            canvasVU: document.getElementById('vu-meter')
        };
        const ctxVU = DOM.canvasVU.getContext('2d');
        let targetTrackIdForImport = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
                masterGain = audioCtx.createGain();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                masterGain.connect(analyser);
                analyser.connect(audioCtx.destination);

                // Init track gains
                state.tracks.forEach(t => {
                    t.gainNode = audioCtx.createGain();
                    t.gainNode.gain.value = t.volume;
                    t.gainNode.connect(masterGain);
                });
                startVUMeter();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function renderTracksDOM() {
            DOM.headers.innerHTML = '';
            // Conserve playhead but clear lanes
            DOM.tracksArea.innerHTML = '';
            DOM.tracksArea.appendChild(DOM.playhead);

            state.tracks.forEach((track, idx) => {
                // Header (Mixer)
                const header = document.createElement('div');
                header.className = 'track-header';
                header.innerHTML = `
                    <div class="track-title">${track.name}</div>
                    <div class="track-controls">
                        <button class="t-btn btn-mute ${track.muted ? 'mute-active' : ''}" data-id="${track.id}">M</button>
                        <button class="t-btn btn-solo ${track.solo ? 'active' : ''}" data-id="${track.id}">S</button>
                        <input type="range" class="vol-slider" data-id="${track.id}" min="0" max="1.5" step="0.01" value="${track.volume}">
                    </div>
                    <div class="btn-import" data-id="${track.id}">📁 Importer</div>
                `;
                DOM.headers.appendChild(header);

                // Event Listeners for Mixer
                header.querySelector('.btn-mute').onclick = (e) => {
                    track.muted = !track.muted;
                    e.target.classList.toggle('mute-active', track.muted);
                    updateMixerRouting();
                };
                header.querySelector('.btn-solo').onclick = (e) => {
                    track.solo = !track.solo;
                    e.target.classList.toggle('active', track.solo);
                    updateMixerRouting();
                };
                header.querySelector('.vol-slider').oninput = (e) => {
                    track.volume = parseFloat(e.target.value);
                    updateMixerRouting();
                };
                header.querySelector('.btn-import').onclick = () => {
                    initAudio();
                    targetTrackIdForImport = track.id;
                    DOM.fileInput.click();
                };

                // Timeline Lane
                const lane = document.createElement('div');
                lane.className = 'track-lane';
                lane.dataset.trackId = track.id;
                DOM.tracksArea.appendChild(lane);
            });

            // Re-append existing clips to their lanes
            state.clips.forEach(clip => {
                const lane = DOM.tracksArea.querySelector(`.track-lane[data-track-id="${clip.trackId}"]`);
                if (lane) lane.appendChild(clip.el);
            });
        }

        function updateMixerRouting() {
            if (!audioCtx) return;
            const anySolo = state.tracks.some(t => t.solo);
            state.tracks.forEach(track => {
                let targetVol = track.volume;
                if (track.muted) targetVol = 0;
                if (anySolo && !track.solo) targetVol = 0;
                if (track.gainNode) {
                    track.gainNode.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.05);
                }
            });
        }

        document.getElementById('btn-add-track').onclick = () => {
            initAudio();
            const newTrack = {
                id: 't' + Date.now(),
                name: `Piste ${state.tracks.length + 1}`,
                volume: 1, muted: false, solo: false,
                gainNode: audioCtx.createGain()
            };
            newTrack.gainNode.connect(masterGain);
            state.tracks.push(newTrack);
            renderTracksDOM();
        };

        DOM.fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            DOM.fileInput.value = '';

            const arrayBuffer = await file.arrayBuffer();
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

            const clip = {
                id: 'c_' + Date.now(),
                trackId: targetTrackIdForImport,
                name: file.name,
                buffer: audioBuffer,
                startTime: state.pauseTime,
                startOffset: 0,
                duration: audioBuffer.duration,
                fadeIn: 0, fadeOut: 0,
                gain: 1.0, // Clip-level gain
                sourceNode: null, fadeGainNode: null, clipGainNode: null, el: null
            };

            state.clips.push(clip);
            renderClipDOM(clip);
            updateWorkspaceWidth();
        });

        function renderClipDOM(clip) {
            const lane = DOM.tracksArea.querySelector(`.track-lane[data-track-id="${clip.trackId}"]`);
            if (!lane) return;

            const el = document.createElement('div');
            el.className = 'audio-clip';
            el.id = clip.id;
            clip.el = el;

            // Internal Elements
            const nameEl = document.createElement('div'); nameEl.className = 'clip-name'; nameEl.innerText = clip.name;
            const canvas = document.createElement('canvas'); canvas.className = 'clip-waveform';
            const gainLine = document.createElement('div'); gainLine.className = 'clip-gain-line';

            const hTrimL = document.createElement('div'); hTrimL.className = 'handle-trim left';
            const hTrimR = document.createElement('div'); hTrimR.className = 'handle-trim right';
            const hFadeL = document.createElement('div'); hFadeL.className = 'handle-fade left';
            const hFadeR = document.createElement('div'); hFadeR.className = 'handle-fade right';
            const pFadeL = document.createElement('div'); pFadeL.className = 'fade-poly left';
            const pFadeR = document.createElement('div'); pFadeR.className = 'fade-poly right';

            el.append(canvas, nameEl, gainLine, pFadeL, pFadeR, hTrimL, hTrimR, hFadeL, hFadeR);
            lane.appendChild(el);

            drawWaveform(clip, canvas);
            updateClipVisuals(clip);

            // --- Mouse Interactions ---
            let action = null;
            let startX = 0, startY = 0;
            let initStart = 0, initOffset = 0, initDur = 0, initFade = 0, initGain = 1;

            const onMouseDown = (e, act) => {
                e.stopPropagation();
                selectClip(clip.id);
                action = act;
                startX = e.clientX; startY = e.clientY;
                initStart = clip.startTime; initOffset = clip.startOffset; initDur = clip.duration;
                initFade = (act === 'fade-left') ? clip.fadeIn : clip.fadeOut;
                initGain = clip.gain;
            };

            el.addEventListener('mousedown', (e) => onMouseDown(e, 'move'));
            hTrimL.addEventListener('mousedown', (e) => onMouseDown(e, 'trim-left'));
            hTrimR.addEventListener('mousedown', (e) => onMouseDown(e, 'trim-right'));
            hFadeL.addEventListener('mousedown', (e) => onMouseDown(e, 'fade-left'));
            hFadeR.addEventListener('mousedown', (e) => onMouseDown(e, 'fade-right'));
            gainLine.addEventListener('mousedown', (e) => onMouseDown(e, 'gain'));

            const onMouseMove = (e) => {
                if (!action) return;
                const deltaX = (e.clientX - startX) / state.pixelsPerSecond;
                const deltaY = e.clientY - startY;

                if (action === 'move') {
                    // X-axis: Time
                    clip.startTime = Math.max(0, initStart + deltaX);

                    // Y-axis: Track Switching
                    const rect = DOM.tracksArea.getBoundingClientRect();
                    const yPos = e.clientY - rect.top;
                    const trackHeight = 110; // Must match CSS --track-height
                    let newTrackIdx = Math.floor(yPos / trackHeight);
                    newTrackIdx = Math.max(0, Math.min(newTrackIdx, state.tracks.length - 1));
                    const newTrackId = state.tracks[newTrackIdx].id;

                    if (clip.trackId !== newTrackId) {
                        clip.trackId = newTrackId;
                        DOM.tracksArea.querySelector(`.track-lane[data-track-id="${newTrackId}"]`).appendChild(clip.el);
                    }
                }
                else if (action === 'gain') {
                    // Drag up (negative deltaY) increases gain, drag down decreases
                    let newGain = initGain - (deltaY / 40);
                    clip.gain = Math.max(0, Math.min(newGain, 2.5)); // Max gain 2.5x
                }
                else if (action === 'trim-left') {
                    let d = deltaX;
                    if (initOffset + d < 0) d = -initOffset;
                    if (initDur - d < 0.1) d = initDur - 0.1;
                    clip.startOffset = initOffset + d;
                    clip.duration = initDur - d;
                    clip.startTime = initStart + d;
                    if (clip.fadeIn > clip.duration) clip.fadeIn = clip.duration;
                    if (clip.fadeOut > clip.duration) clip.fadeOut = clip.duration;
                }
                else if (action === 'trim-right') {
                    let d = deltaX;
                    const maxDur = clip.buffer.duration - clip.startOffset;
                    if (initDur + d > maxDur) d = maxDur - initDur;
                    if (initDur + d < 0.1) d = 0.1 - initDur;
                    clip.duration = initDur + d;
                    if (clip.fadeIn > clip.duration) clip.fadeIn = clip.duration;
                    if (clip.fadeOut > clip.duration) clip.fadeOut = clip.duration;
                }
                else if (action === 'fade-left') {
                    let f = initFade + deltaX;
                    clip.fadeIn = Math.max(0, Math.min(f, clip.duration - clip.fadeOut));
                }
                else if (action === 'fade-right') {
                    let f = initFade - deltaX;
                    clip.fadeOut = Math.max(0, Math.min(f, clip.duration - clip.fadeIn));
                }

                updateClipVisuals(clip);
                if (action !== 'gain') updateWorkspaceWidth();
            };

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', () => action = null);
        }

        function updateClipVisuals(clip) {
            if (!clip.el) return;
            clip.el.style.left = `${clip.startTime * state.pixelsPerSecond}px`;
            clip.el.style.width = `${clip.duration * state.pixelsPerSecond}px`;

            // Fades
            const inPx = clip.fadeIn * state.pixelsPerSecond;
            const outPx = clip.fadeOut * state.pixelsPerSecond;
            clip.el.querySelector('.handle-fade.left').style.left = `${inPx}px`;
            clip.el.querySelector('.fade-poly.left').style.width = `${inPx}px`;
            clip.el.querySelector('.handle-fade.right').style.right = `${outPx}px`;
            clip.el.querySelector('.fade-poly.right').style.width = `${outPx}px`;

            // Gain Line & Waveform Scale
            const gainPercent = Math.max(0, Math.min((1 - (clip.gain / 2)) * 100, 100));
            clip.el.querySelector('.clip-gain-line').style.top = `${gainPercent}%`;

            const canvas = clip.el.querySelector('.clip-waveform');
            canvas.style.transform = `scaleY(${clip.gain})`;
            canvas.style.width = `${clip.buffer.duration * state.pixelsPerSecond}px`;
            canvas.style.left = `-${clip.startOffset * state.pixelsPerSecond}px`;
        }

        function drawWaveform(clip, canvas) {
            const dpr = window.devicePixelRatio || 1;
            const cssWidth = clip.buffer.duration * state.pixelsPerSecond;
            const cssHeight = 100;

            // Limite interne pour éviter les plantages sur les fichiers très longs
            const maxInternalWidth = 32000;
            let internalWidth = cssWidth * dpr;
            if (internalWidth > maxInternalWidth) {
                internalWidth = maxInternalWidth;
            }

            canvas.width = internalWidth;
            canvas.height = cssHeight * dpr;

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const data = clip.buffer.getChannelData(0);

            // Le nombre d'échantillons par pixel interne
            const step = Math.max(1, Math.floor(data.length / internalWidth));
            const amp = (cssHeight * dpr) / 2;

            // Tracé vectoriel continu pour une netteté absolue
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.beginPath();
            ctx.moveTo(0, amp);

            // 1. Dessin de la crête supérieure (Top envelope)
            for (let i = 0; i < internalWidth; i++) {
                let max = 0;
                const offset = i * step;
                const limit = Math.min(offset + step, data.length);
                for (let j = offset; j < limit; j++) {
                    if (data[j] > max) max = data[j];
                }
                ctx.lineTo(i, amp - (max * amp));
            }

            // 2. Dessin de la crête inférieure (Bottom envelope) en sens inverse
            for (let i = internalWidth - 1; i >= 0; i--) {
                let min = 0;
                const offset = i * step;
                const limit = Math.min(offset + step, data.length);
                for (let j = offset; j < limit; j++) {
                    if (data[j] < min) min = data[j];
                }
                ctx.lineTo(i, amp - (min * amp));
            }

            ctx.closePath();
            ctx.fill();
        }

        function selectClip(id) {
            state.selectedClipId = id;
            document.querySelectorAll('.audio-clip').forEach(el => el.classList.remove('selected'));
            if (id) document.getElementById(id).classList.add('selected');
        }

        function scheduleClipPlayback(clip, ctx) {
            const source = ctx.createBufferSource();
            source.buffer = clip.buffer;

            // Two Gain Nodes: One for Fades (automation), One for Clip Gain (static scaling)
            const fadeGain = ctx.createGain();
            const clipGain = ctx.createGain();
            clipGain.gain.value = clip.gain;

            const track = state.tracks.find(t => t.id === clip.trackId);
            if (!track || !track.gainNode) return;

            source.connect(fadeGain);
            fadeGain.connect(clipGain);
            clipGain.connect(track.gainNode); // Route to Track Mixer

            if (ctx === audioCtx) {
                clip.sourceNode = source;
                clip.fadeGainNode = fadeGain;
                clip.clipGainNode = clipGain;
            }

            const ctxTime = ctx.currentTime;
            const timeToStart = clip.startTime - state.pauseTime;
            let delay = timeToStart;
            let playOffset = clip.startOffset;
            let playDuration = clip.duration;

            if (timeToStart < 0) {
                const passed = Math.abs(timeToStart);
                if (passed >= playDuration) return;
                playOffset += passed;
                playDuration -= passed;
                delay = 0;
            }

            const absStart = ctxTime + delay;
            const absEnd = absStart + playDuration;

            // Automation for Fades
            fadeGain.gain.setValueAtTime(0, ctxTime);

            const trueStart = absStart - (timeToStart < 0 ? Math.abs(timeToStart) : 0);
            const fadeInEnd = trueStart + clip.fadeIn;
            const fadeOutStart = trueStart + clip.duration - clip.fadeOut;

            if (timeToStart >= 0) {
                fadeGain.gain.setValueAtTime(0, absStart);
                if (clip.fadeIn > 0) fadeGain.gain.linearRampToValueAtTime(1, fadeInEnd);
                else fadeGain.gain.setValueAtTime(1, absStart);
            } else {
                if (ctxTime < fadeInEnd) {
                    const currentVol = (ctxTime - trueStart) / clip.fadeIn;
                    fadeGain.gain.setValueAtTime(currentVol, ctxTime);
                    fadeGain.gain.linearRampToValueAtTime(1, fadeInEnd);
                } else {
                    fadeGain.gain.setValueAtTime(1, ctxTime);
                }
            }

            if (ctxTime < fadeOutStart) {
                fadeGain.gain.setValueAtTime(1, fadeOutStart);
                fadeGain.gain.linearRampToValueAtTime(0, absEnd);
            } else if (ctxTime < absEnd) {
                const currentVol = 1 - ((ctxTime - fadeOutStart) / clip.fadeOut);
                fadeGain.gain.setValueAtTime(currentVol, ctxTime);
                fadeGain.gain.linearRampToValueAtTime(0, absEnd);
            }

            source.start(absStart, playOffset, playDuration);
        }

        function play() {
            initAudio();
            if (state.isPlaying) return;
            state.isPlaying = true;
            state.playbackStartTime = audioCtx.currentTime - state.pauseTime;

            state.clips.forEach(clip => scheduleClipPlayback(clip, audioCtx));

            document.getElementById('btn-play').classList.add('primary');
            document.getElementById('btn-pause').classList.remove('primary');
            animationLoop();
        }

        function pause() {
            if (!state.isPlaying) return;
            state.isPlaying = false;
            state.pauseTime = audioCtx.currentTime - state.playbackStartTime;
            stopAllNodes();
            document.getElementById('btn-pause').classList.add('primary');
            document.getElementById('btn-play').classList.remove('primary');
            cancelAnimationFrame(state.animationId);
        }

        function stop() {
            state.isPlaying = false;
            state.pauseTime = 0;
            stopAllNodes();
            document.getElementById('btn-play').classList.remove('primary');
            document.getElementById('btn-pause').classList.remove('primary');
            cancelAnimationFrame(state.animationId);
            updatePlayheadUI(0);
        }

        function stopAllNodes() {
            state.clips.forEach(clip => {
                if (clip.sourceNode) { try { clip.sourceNode.stop(); } catch (e) { } clip.sourceNode.disconnect(); }
                if (clip.fadeGainNode) clip.fadeGainNode.disconnect();
                if (clip.clipGainNode) clip.clipGainNode.disconnect();
                clip.sourceNode = null; clip.fadeGainNode = null; clip.clipGainNode = null;
            });
        }

        DOM.ruler.addEventListener('mousedown', (e) => {
            const rect = DOM.tracksArea.getBoundingClientRect();
            const clickX = e.clientX - rect.left + document.getElementById('timeline-container').scrollLeft;
            const time = clickX / state.pixelsPerSecond;

            const wasPlaying = state.isPlaying;
            if (wasPlaying) pause();
            state.pauseTime = Math.max(0, time);
            updatePlayheadUI(state.pauseTime);
            if (wasPlaying) play();
        });

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') {
                e.preventDefault();
                state.isPlaying ? pause() : play();
            } else if (e.code === 'KeyS') {
                splitSelected();
            } else if (e.code === 'Delete' || e.code === 'Backspace') {
                deleteSelected();
            }
        });

        function splitSelected() {
            if (!state.selectedClipId) return;
            const idx = state.clips.findIndex(c => c.id === state.selectedClipId);
            if (idx === -1) return;
            const orig = state.clips[idx];
            const pt = state.pauseTime;

            if (pt > orig.startTime && pt < (orig.startTime + orig.duration)) {
                const wasPlaying = state.isPlaying;
                if (wasPlaying) pause();

                const cutOffset = pt - orig.startTime;

                const newClip = {
                    ...orig,
                    id: 'c_' + Date.now(),
                    startTime: pt,
                    startOffset: orig.startOffset + cutOffset,
                    duration: orig.duration - cutOffset,
                    fadeIn: 0,
                    sourceNode: null, fadeGainNode: null, clipGainNode: null, el: null
                };

                orig.duration = cutOffset;
                orig.fadeOut = 0;
                if (orig.fadeIn > orig.duration) orig.fadeIn = orig.duration;
                updateClipVisuals(orig);

                state.clips.push(newClip);
                renderClipDOM(newClip);
                selectClip(newClip.id);

                if (wasPlaying) play();
            }
        }

        function deleteSelected() {
            if (!state.selectedClipId) return;
            const idx = state.clips.findIndex(c => c.id === state.selectedClipId);
            if (idx === -1) return;
            const clip = state.clips[idx];
            if (clip.sourceNode) { try { clip.sourceNode.stop(); } catch (e) { } }
            clip.el.remove();
            state.clips.splice(idx, 1);
            state.selectedClipId = null;
        }

        function animationLoop() {
            if (!state.isPlaying) return;
            state.pauseTime = audioCtx.currentTime - state.playbackStartTime;
            updatePlayheadUI(state.pauseTime);

            const px = state.pauseTime * state.pixelsPerSecond;
            const scrollContainer = document.getElementById('timeline-container');
            if (px > scrollContainer.scrollLeft + scrollContainer.clientWidth - 50) {
                scrollContainer.scrollLeft = px - scrollContainer.clientWidth + 100;
            }
            state.animationId = requestAnimationFrame(animationLoop);
        }

        function updatePlayheadUI(time) {
            DOM.playhead.style.left = `${time * state.pixelsPerSecond}px`;
            const m = Math.floor(time / 60).toString().padStart(2, '0');
            const s = Math.floor(time % 60).toString().padStart(2, '0');
            const ms = Math.floor((time % 1) * 10);
            DOM.timeDisplay.innerText = `${m}:${s}.${ms}`;
        }

        function updateWorkspaceWidth() {
            let max = 60;
            state.clips.forEach(c => { if (c.startTime + c.duration > max) max = c.startTime + c.duration; });
            DOM.tracksArea.style.minWidth = `${(max + 10) * state.pixelsPerSecond}px`;
        }

        function startVUMeter() {
            const data = new Uint8Array(analyser.frequencyBinCount);
            function draw() {
                requestAnimationFrame(draw);
                analyser.getByteFrequencyData(data);
                let sum = 0;
                for (let i = 0; i < data.length; i++) sum += data[i];
                const vol = Math.min(100, (sum / data.length / 128) * 100);

                ctxVU.fillStyle = '#111';
                ctxVU.fillRect(0, 0, DOM.canvasVU.width, DOM.canvasVU.height);

                const grad = ctxVU.createLinearGradient(0, 0, DOM.canvasVU.width, 0);
                grad.addColorStop(0, '#4caf50'); grad.addColorStop(0.8, '#f1c40f'); grad.addColorStop(1, '#e74c3c');
                ctxVU.fillStyle = grad;
                ctxVU.fillRect(0, 0, (vol / 100) * DOM.canvasVU.width, DOM.canvasVU.height);
            }
            draw();
        }

        document.getElementById('btn-play').onclick = play;
        document.getElementById('btn-pause').onclick = pause;
        document.getElementById('btn-stop').onclick = stop;

        document.getElementById('btn-export').addEventListener('click', async () => {
            if (state.clips.length === 0) { alert("Le montage est vide !"); return; }
            if (state.isPlaying) stop();

            const btn = document.getElementById('btn-export');
            btn.innerText = "⏳ Export en cours...";
            btn.disabled = true;

            let maxDur = 0;
            state.clips.forEach(c => { if (c.startTime + c.duration > maxDur) maxDur = c.startTime + c.duration; });
            maxDur += 1;

            const offlineCtx = new OfflineAudioContext(2, audioCtx.sampleRate * maxDur, audioCtx.sampleRate);

            // Recreate Track Routing for Offline
            const anySolo = state.tracks.some(t => t.solo);
            state.tracks.forEach(t => {
                t.offlineGainNode = offlineCtx.createGain();
                let targetVol = t.volume;
                if (t.muted) targetVol = 0;
                if (anySolo && !t.solo) targetVol = 0;
                t.offlineGainNode.gain.value = targetVol;
                t.offlineGainNode.connect(offlineCtx.destination);
            });

            // Route clips to offline tracks
            state.pauseTime = 0;
            state.clips.forEach(clip => {
                const track = state.tracks.find(t => t.id === clip.trackId);
                if (track) {
                    // Temporarily hijack track.gainNode to point to offline node
                    const originalNode = track.gainNode;
                    track.gainNode = track.offlineGainNode;
                    scheduleClipPlayback(clip, offlineCtx);
                    track.gainNode = originalNode; // restore
                }
            });

            try {
                const renderedBuffer = await offlineCtx.startRendering();
                const wavBlob = bufferToWave(renderedBuffer, renderedBuffer.length);
                const a = document.createElement('a');
                a.href = URL.createObjectURL(wavBlob);
                a.download = 'Montage_Podcast.wav';
                a.click();
            } catch (e) {
                alert("Erreur lors de l'exportation.");
            }

            btn.innerText = "💾 Exporter WAV";
            btn.disabled = false;
        });

        function bufferToWave(abuffer, len) {
            let numOfChan = abuffer.numberOfChannels, length = len * numOfChan * 2 + 44,
                buffer = new ArrayBuffer(length), view = new DataView(buffer),
                channels = [], i, sample, offset = 0, pos = 0;

            function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

            setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
            setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
            setUint32(abuffer.sampleRate); setUint32(abuffer.sampleRate * 2 * numOfChan);
            setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164); setUint32(length - pos - 4);

            for (i = 0; i < abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));

            while (pos < length) {
                for (i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
                    view.setInt16(pos, sample, true); pos += 2;
                }
                offset++;
            }
            return new Blob([buffer], { type: "audio/wav" });
        }

        // Init
        renderTracksDOM();
    </script>
