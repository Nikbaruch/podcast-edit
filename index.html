<!DOCTYPE html>
<html lang="fr" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Podcast - Design Minimal</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DotGothic16&family=JetBrains+Mono:wght@100;300;400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* LIGHT THEME (Nothing/Dot Matrix Style) */
            --bg-base: #F5F5F5;
            --bg-surface: #EBEBEB;
            --bg-elevated: #DFDFDF;
            --border-color: #CCCCCC;
            --text-primary: #1A1A1A;
            --text-secondary: #7A7A7A;

            --clip-bg: rgba(224, 224, 224, 0.85);
            /* Transparent pour voir les crossfades */
            --clip-border: #999999;
            --clip-waveform: #1A1A1A;

            --accent: #E53935;
            /* Rouge discret pour l'enregistrement/play actif */
            --accent-active: #000000;

            --font-pixel: 'DotGothic16', sans-serif;
            --font-tech: 'JetBrains Mono', monospace;
        }

        [data-theme="dark"] {
            /* DARK THEME */
            --bg-base: #0A0A0A;
            --bg-surface: #141414;
            --bg-elevated: #1F1F1F;
            --border-color: #333333;
            --text-primary: #EEEEEE;
            --text-secondary: #888888;

            --clip-bg: rgba(34, 34, 34, 0.85);
            /* Transparent pour voir les crossfades */
            --clip-border: #555555;
            --clip-waveform: #EEEEEE;

            --accent: #FF4444;
            --accent-active: #FFFFFF;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-tech);
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: var(--bg-base);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* TYPOGRAPHY */
        .pixel-text {
            font-family: var(--font-pixel);
            font-size: 28px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* TOPBAR (CONTROLS) */
        .topbar {
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            background: var(--bg-base);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .topbar-group {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-right: 20px;
        }

        .logo-icon {
            font-family: var(--font-pixel);
            font-size: 24px;
        }

        .icon-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            width: 36px;
            height: 36px;
            border-radius: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon-btn:hover {
            border-color: var(--border-color);
            color: var(--text-primary);
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        .icon-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
            border-color: transparent;
        }

        /* TRANSPORT CONTROLS (MINIMAL) */
        .transport-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-surface);
            padding: 5px 10px;
            border-radius: 0;
            border: 1px solid var(--border-color);
        }

        .t-play-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 16px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 0;
            transition: 0.2s;
        }

        .t-play-btn:hover {
            background: var(--bg-elevated);
        }

        .t-play-btn.playing {
            color: var(--accent);
        }

        .t-play-btn.paused {
            color: var(--text-secondary);
        }

        .time-display {
            font-family: var(--font-tech);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-primary);
            min-width: 110px;
            text-align: center;
            margin: 0 20px;
        }

        .btn-text {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            font-family: var(--font-tech);
            font-weight: 400;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            border-radius: 0;
        }

        .btn-text:hover {
            background: var(--text-primary);
            color: var(--bg-base);
        }

        /* MAIN WORKSPACE */
        .main-content {
            flex-grow: 1;
            display: flex;
            position: relative;
            overflow: hidden;
            /* Prevent body scroll */
        }

        /* EDITOR AREA */
        .editor {
            display: flex;
            flex-grow: 1;
            overflow-y: auto;
            /* IMPORTANT: Enable vertical scroll for the entire track area */
            overflow-x: hidden;
        }

        .track-headers-container {
            width: 240px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 20;
            flex-shrink: 0;
            /* Remove overflow-y here, let .editor handle it or keep it sticky */
        }

        .timeline-container {
            flex-grow: 1;
            overflow-x: auto;
            /* Remove overflow-y: hidden, it restricts content */
            position: relative;
            background: var(--bg-base);
        }

        /* VU METER SIDEBAR (RIGHT) */
        .vu-sidebar {
            width: 60px;
            background: var(--bg-surface);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            z-index: 50;
            flex-shrink: 0;
        }

        .vu-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
            margin-bottom: 20px;
        }

        .vu-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 10px;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            letter-spacing: 2px;
        }

        #vu-meter {
            width: 12px;
            height: 100%;
            background: var(--bg-elevated);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .clip-warning {
            color: var(--accent);
            font-size: 10px;
            font-weight: 700;
            margin-bottom: 10px;
            opacity: 0;
            transition: 0.1s;
        }

        .clip-warning.active {
            opacity: 1;
        }

        /* MAC SCROLLBAR */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        .time-ruler {
            height: 30px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
            cursor: ew-resize;
        }

        .ruler-spacer {
            height: 30px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-surface);
            display: flex;
            align-items: center;
            padding-left: 20px;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-secondary);
            position: sticky;
            top: 0;
            z-index: 25;
            /* Keep spacer sticky when scrolling */
        }

        .tracks-area {
            position: relative;
            min-width: 100%;
            min-height: 100%;
        }

        .track-header {
            position: relative;
            padding: 10px 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .track-resizer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            cursor: ns-resize;
            background: transparent;
            z-index: 5;
        }

        .track-resizer:hover {
            background: var(--border-color);
        }

        .track-title {
            font-family: var(--font-pixel);
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .track-controls {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .t-btn {
            width: 24px;
            height: 24px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-family: var(--font-tech);
            font-weight: 400;
            font-size: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .t-btn:hover {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        .t-btn.active {
            background: var(--text-primary);
            color: var(--bg-base);
            border-color: var(--text-primary);
        }

        .t-btn.mute-active {
            background: var(--text-secondary);
            color: var(--bg-base);
        }

        .vol-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 2px;
            background: var(--border-color);
            outline: none;
            margin-left: 8px;
            flex-grow: 1;
        }

        .vol-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 8px;
            height: 12px;
            background: var(--text-primary);
            cursor: pointer;
            border-radius: 0;
        }

        .btn-import {
            background: transparent;
            border: 1px dashed var(--border-color);
            color: var(--text-secondary);
            padding: 4px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 300;
            margin-top: 8px;
            transition: 0.2s;
            text-align: center;
            font-family: var(--font-tech);
        }

        .btn-import:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
        }

        .track-lane {
            border-bottom: 1px solid var(--border-color);
            position: relative;
            background: transparent;
        }

        .track-lane::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            background-image: linear-gradient(to right, var(--border-color) 1px, transparent 1px);
            background-size: 100px 100%;
            pointer-events: none;
            opacity: 0.2;
        }

        /* AUDIO CLIPS (Minimal) */
        .audio-clip {
            position: absolute;
            top: 5px;
            background: var(--clip-bg);
            border: 1px solid var(--clip-border);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            /* overflow: hidden removed from here, applied to internal container instead */
        }

        .audio-clip.selected {
            border: 1px solid var(--text-primary);
            z-index: 10;
        }

        .clip-name {
            position: absolute;
            top: 2px;
            left: 6px;
            font-size: 9px;
            font-weight: 400;
            z-index: 3;
            pointer-events: none;
            color: var(--text-primary);
            background: var(--clip-bg);
            padding: 0 4px;
            opacity: 0.8;
            letter-spacing: 0.5px;
        }

        .clip-gain-display {
            position: absolute;
            top: 16px;
            left: 6px;
            font-size: 9px;
            font-weight: 700;
            z-index: 4;
            pointer-events: none;
            color: var(--bg-base);
            background: var(--text-primary);
            padding: 0 4px;
            opacity: 0;
            transition: opacity 0.2s;
            letter-spacing: 1px;
        }

        .clip-gain-display.show {
            opacity: 1;
        }

        .clip-waveform {
            position: absolute;
            top: 0;
            bottom: 0;
            pointer-events: none;
            height: 100%;
        }

        /* HANDLES */
        .handle-trim {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 8px;
            cursor: ew-resize;
            z-index: 5;
            background: rgba(0, 0, 0, 0.03);
            border-left: 1px solid transparent;
            border-right: 1px solid transparent;
        }

        .handle-trim:hover {
            background: rgba(0, 0, 0, 0.1);
            border-color: var(--border-color);
        }

        [data-theme="dark"] .handle-trim:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .handle-trim.left {
            left: 0;
        }

        .handle-trim.right {
            right: 0;
        }

        .clip-gain-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--text-primary);
            cursor: ns-resize;
            z-index: 15;
            opacity: 0.5;
            transition: opacity 0.2s, height 0.2s;
        }

        .clip-gain-line:hover {
            opacity: 1;
            height: 3px;
        }

        .handle-fade {
            position: absolute;
            top: -4px;
            width: 8px;
            height: 8px;
            cursor: pointer;
            z-index: 16;
            background: var(--text-primary);
        }

        .handle-fade.left {
            left: -4px;
        }

        .handle-fade.right {
            right: -4px;
        }

        .fade-poly {
            position: absolute;
            top: 0;
            bottom: 0;
            background: var(--bg-base);
            pointer-events: none;
            z-index: 4;
            opacity: 0.7;
        }

        .fade-poly.left {
            left: 0;
            clip-path: polygon(0 0, 0 100%, 100% 0);
        }

        .fade-poly.right {
            right: 0;
            clip-path: polygon(0 0, 100% 0, 100% 100%);
        }

        .fade-poly.auto-fade {
            background: var(--accent);
            opacity: 0.4;
        }

        /* Visuel rouge pour le crossfade auto */

        .playhead {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 1px;
            background: var(--accent);
            left: 0;
            z-index: 20;
            /* Changement: active les events sur toute la ligne rouge */
            pointer-events: auto;
            cursor: ew-resize;
        }

        /* Zone élargie invisible pour attraper facilement la ligne */
        .playhead::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: -6px;
            width: 13px;
            cursor: ew-resize;
        }

        .playhead::before {
            content: '';
            position: absolute;
            top: 0;
            left: -3px;
            width: 7px;
            height: 7px;
            background: var(--accent);
            cursor: ew-resize;
            pointer-events: auto;
        }

        .instructions-footer {
            padding: 10px 30px;
            background: var(--bg-base);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .inst-group {
            display: flex;
            gap: 20px;
        }

        kbd {
            font-family: var(--font-tech);
            color: var(--text-primary);
            font-weight: 700;
        }

        #start-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-base);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .start-btn {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--text-primary);
            padding: 15px 40px;
            font-size: 14px;
            font-family: var(--font-tech);
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 2px;
        }

        .start-btn:hover {
            background: var(--text-primary);
            color: var(--bg-base);
        }

        .snap-indicator {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 1px;
            background: var(--text-secondary);
            z-index: 25;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
        }
    </style>
</head>

<body>

    <div id="start-overlay">
        <div class="pixel-text" style="margin-bottom: 10px; font-size: 40px;">STUDIO.APP</div>
        <p style="color: var(--text-secondary); margin-bottom: 40px; font-size: 12px;">INITIATING AUDIO ENGINE</p>
        <button class="start-btn" id="btn-start">OPEN</button>
    </div>

    <!-- TOPBAR -->
    <div class="topbar">
        <div class="topbar-group">
            <div class="logo-container">
                <div class="logo-icon">[:.:]</div>
                <div class="pixel-text" style="font-size: 20px;">STUD</div>
            </div>

            <button class="icon-btn" id="btn-theme" title="THEME"><i
                    class="fa-solid fa-circle-half-stroke"></i></button>

            <div style="width: 1px; height: 20px; background: var(--border-color); margin: 0 10px;"></div>

            <button class="icon-btn" id="btn-undo" title="UNDO" disabled><i
                    class="fa-solid fa-rotate-left"></i></button>
            <button class="icon-btn" id="btn-redo" title="REDO" disabled><i
                    class="fa-solid fa-rotate-right"></i></button>

            <div style="width: 1px; height: 20px; background: var(--border-color); margin: 0 10px;"></div>

            <button class="icon-btn" id="btn-zoom-out" title="ZOOM OUT"><i class="fa-solid fa-minus"></i></button>
            <button class="icon-btn" id="btn-zoom-in" title="ZOOM IN"><i class="fa-solid fa-plus"></i></button>
        </div>

        <div class="transport-controls">
            <button class="t-play-btn" id="btn-play" title="PLAY (SPACE)"><i class="fa-solid fa-play"></i></button>
            <button class="t-play-btn" id="btn-pause" title="PAUSE"><i class="fa-solid fa-pause"></i></button>
            <button class="t-play-btn" id="btn-stop" title="STOP"><i class="fa-solid fa-square"></i></button>
            <div class="time-display" id="time-display">00:00.0</div>
        </div>

        <div class="topbar-group">
            <button class="btn-text" id="btn-add-track">+ TRACK</button>
            <button class="btn-text" id="btn-export">EXPORT MIX</button>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main-content">
        <div class="editor" id="workspace" onscroll="syncScroll(this)">
            <div class="track-headers-container" id="headers-container">
                <div class="ruler-spacer">TRACKS</div>
                <div id="track-headers"></div>
            </div>

            <div class="timeline-container" id="timeline-container">
                <div class="time-ruler" id="ruler"></div>
                <div class="tracks-area" id="tracks-area">
                    <div class="playhead" id="playhead"></div>
                    <div class="snap-indicator" id="snap-indicator"></div>
                </div>
            </div>
        </div>

        <!-- VU METER SIDEBAR -->
        <div class="vu-sidebar">
            <div class="clip-warning" id="clip-warning">PEAK</div>
            <div class="vu-container" title="MASTER OUT">
                <canvas id="vu-meter"></canvas>
            </div>
            <span class="vu-label">MASTER</span>
        </div>
    </div>

    <div class="instructions-footer">
        <div class="inst-group">
            <div><kbd>SPACE</kbd> PLAY/PAUSE</div>
            <div><kbd>S</kbd> SPLIT</div>
            <div><kbd>DEL</kbd> REMOVE</div>
            <div><kbd>SHIFT</kbd>+<kbd>CLICK</kbd> SELECT</div>
            <div><kbd>◄</kbd> <kbd>►</kbd> NUDGE (0.1S)</div>
        </div>
        <div>V2.0.0 // BROWSER BASED EDITOR</div>
    </div>

    <input type="file" id="file-input" accept="audio/*" style="display: none;">

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx, masterGain, analyser;
        let clipHoldTime = 0;

        const state = {
            pixelsPerSecond: 80,
            isPlaying: false,
            playbackStartTime: 0,
            pauseTime: 0,
            selectedClipIds: [], // Tableau pour multi-selection
            dragInitialStates: [], // Pour stocker les positions initiales du drag
            animationId: null,
            snapThreshold: 0.2, // seconds
            clips: [],
            tracks: [
                { id: 't0', name: 'Voix 1', volume: 1, muted: false, solo: false, height: 120, gainNode: null },
                { id: 't1', name: 'Voix 2', volume: 1, muted: false, solo: false, height: 120, gainNode: null },
                { id: 't2', name: 'Habillage', volume: 0.7, muted: false, solo: false, height: 120, gainNode: null },
                { id: 't3', name: 'Effets', volume: 0.7, muted: false, solo: false, height: 120, gainNode: null }
            ]
        };

        const history = { past: [], future: [] };

        const DOM = {
            headers: document.getElementById('track-headers'),
            tracksArea: document.getElementById('tracks-area'),
            ruler: document.getElementById('ruler'),
            playhead: document.getElementById('playhead'),
            snapInd: document.getElementById('snap-indicator'),
            timeDisplay: document.getElementById('time-display'),
            fileInput: document.getElementById('file-input'),
            canvasVU: document.getElementById('vu-meter'),
            btnUndo: document.getElementById('btn-undo'),
            btnRedo: document.getElementById('btn-redo'),
            editor: document.getElementById('workspace'),
            timelineContainer: document.getElementById('timeline-container')
        };
        const ctxVU = DOM.canvasVU.getContext('2d');
        let targetTrackIdForImport = null;

        function syncScroll(el) { }

        document.getElementById('btn-start').onclick = () => {
            document.getElementById('start-overlay').style.display = 'none';
            initAudio();
        };

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
                masterGain = audioCtx.createGain();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                masterGain.connect(analyser);
                analyser.connect(audioCtx.destination);

                state.tracks.forEach(t => {
                    t.gainNode = audioCtx.createGain();
                    t.gainNode.gain.value = t.volume;
                    t.gainNode.connect(masterGain);
                });
                startVUMeter();
                saveState(); // Initial save
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function cloneClips() {
            return state.clips.map(c => ({
                id: c.id, trackId: c.trackId, name: c.name, buffer: c.buffer,
                startTime: c.startTime, startOffset: c.startOffset, duration: c.duration,
                fadeIn: c.fadeIn, fadeOut: c.fadeOut, gain: c.gain,
                autoFadeIn: c.autoFadeIn, autoFadeOut: c.autoFadeOut
            }));
        }

        function saveState() {
            history.past.push(cloneClips());
            if (history.past.length > 30) history.past.shift();
            history.future = [];
            updateHistoryUI();
        }

        function undo() {
            if (!history.past.length || history.past.length === 1) return;
            history.future.push(cloneClips());
            history.past.pop();
            const previousState = history.past[history.past.length - 1];
            restoreState(previousState);
            updateHistoryUI();
        }

        function redo() {
            if (!history.future.length) return;
            const nextState = history.future.pop();
            history.past.push(cloneClips());
            restoreState(nextState);
            updateHistoryUI();
        }

        function updateHistoryUI() {
            DOM.btnUndo.disabled = history.past.length <= 1;
            DOM.btnRedo.disabled = history.future.length === 0;
        }

        function restoreState(savedClips) {
            const wasPlaying = state.isPlaying;
            if (wasPlaying) pause();

            document.querySelectorAll('.audio-clip').forEach(el => el.remove());
            state.selectedClipIds = []; // Clear selection on undo/redo

            state.clips = savedClips.map(c => ({
                ...c, sourceNode: null, fadeGainNode: null, clipGainNode: null, el: null
            }));

            state.clips.forEach(clip => renderClipDOM(clip));
            updateCrossfades();
            updateWorkspaceWidth();

            if (wasPlaying) play();
        }

        function renderTracksDOM() {
            DOM.headers.innerHTML = '';
            document.querySelectorAll('.track-lane').forEach(el => el.remove());

            state.tracks.forEach((track) => {
                const header = document.createElement('div');
                header.className = 'track-header';
                header.style.height = `${track.height}px`;
                header.innerHTML = `
                    <div class="track-title">${track.name}</div>
                    <div class="track-controls">
                        <button class="t-btn btn-mute ${track.muted ? 'mute-active' : ''}">M</button>
                        <button class="t-btn btn-solo ${track.solo ? 'active' : ''}">S</button>
                        <input type="range" class="vol-slider" min="0" max="1.5" step="0.01" value="${track.volume}">
                    </div>
                    <div class="btn-import"><i class="fa-solid fa-plus"></i> Importer</div>
                    <div class="track-resizer"></div>
                `;
                DOM.headers.appendChild(header);

                header.querySelector('.btn-mute').onclick = (e) => { track.muted = !track.muted; e.target.classList.toggle('mute-active'); updateMixerRouting(); };
                header.querySelector('.btn-solo').onclick = (e) => { track.solo = !track.solo; e.target.classList.toggle('active'); updateMixerRouting(); };
                header.querySelector('.vol-slider').oninput = (e) => { track.volume = parseFloat(e.target.value); updateMixerRouting(); };
                header.querySelector('.btn-import').onclick = () => { initAudio(); targetTrackIdForImport = track.id; DOM.fileInput.click(); };

                const lane = document.createElement('div');
                lane.className = 'track-lane';
                lane.style.height = `${track.height}px`;
                lane.dataset.trackId = track.id;
                DOM.tracksArea.appendChild(lane);

                let isResizing = false;
                let startY = 0; let startHeight = 0;
                const resizer = header.querySelector('.track-resizer');

                resizer.onmousedown = (e) => {
                    isResizing = true; startY = e.clientY; startHeight = track.height;
                    document.body.style.cursor = 'ns-resize';
                };

                const onMouseMove = (e) => {
                    if (!isResizing) return;
                    let newH = startHeight + (e.clientY - startY);
                    if (newH < 80) newH = 80;
                    track.height = newH;
                    header.style.height = `${newH}px`;
                    lane.style.height = `${newH}px`;

                    state.clips.filter(c => c.trackId === track.id).forEach(clip => {
                        clip.el.style.height = `${newH - 20}px`;
                        drawWaveform(clip, clip.el.querySelector('.clip-waveform'), track.height);
                    });
                };
                const onMouseUp = () => { if (isResizing) { isResizing = false; document.body.style.cursor = 'default'; } };
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });

            state.clips.forEach(clip => {
                if (clip.el) {
                    const lane = DOM.tracksArea.querySelector(`.track-lane[data-track-id="${clip.trackId}"]`);
                    if (lane) lane.appendChild(clip.el);
                }
            });
        }

        document.getElementById('btn-add-track').onclick = () => {
            initAudio();
            const newTrack = { id: 't' + Date.now(), name: `Piste ${state.tracks.length + 1}`, volume: 1, muted: false, solo: false, height: 120, gainNode: audioCtx.createGain() };
            newTrack.gainNode.connect(masterGain);
            state.tracks.push(newTrack);
            renderTracksDOM();
        };

        // Désélection si clic dans le vide
        DOM.tracksArea.addEventListener('mousedown', (e) => {
            if (e.target.id === 'tracks-area' || e.target.classList.contains('track-lane')) {
                selectClip(null);
            }
        });

        function updateMixerRouting() {
            if (!audioCtx) return;
            const anySolo = state.tracks.some(t => t.solo);
            state.tracks.forEach(track => {
                let targetVol = track.volume;
                if (track.muted) targetVol = 0;
                if (anySolo && !track.solo) targetVol = 0;
                if (track.gainNode) track.gainNode.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.05);
            });
        }

        function getSnapTime(time, ignoreClipId) {
            let snapPoints = [state.pauseTime];
            state.clips.forEach(c => {
                if (c.id !== ignoreClipId) {
                    snapPoints.push(c.startTime);
                    snapPoints.push(c.startTime + c.duration);
                }
            });

            let closest = time;
            let minDiff = state.snapThreshold;

            snapPoints.forEach(p => {
                if (Math.abs(time - p) < minDiff) {
                    minDiff = Math.abs(time - p);
                    closest = p;
                }
            });

            if (closest !== time) {
                DOM.snapInd.style.opacity = 1;
                DOM.snapInd.style.left = `${closest * state.pixelsPerSecond}px`;
            } else {
                DOM.snapInd.style.opacity = 0;
            }
            return closest;
        }

        function updateCrossfades() {
            state.tracks.forEach(track => {
                const trackClips = state.clips.filter(c => c.trackId === track.id).sort((a, b) => a.startTime - b.startTime);

                // On remet à zéro les fades auto avant de recalculer
                trackClips.forEach(c => { c.autoFadeIn = 0; c.autoFadeOut = 0; });

                for (let i = 0; i < trackClips.length - 1; i++) {
                    let cA = trackClips[i];
                    for (let j = i + 1; j < trackClips.length; j++) {
                        let cB = trackClips[j];
                        // Calcul du chevauchement
                        let overlap = (cA.startTime + cA.duration) - cB.startTime;

                        if (overlap > 0 && cA.startTime < cB.startTime) {
                            let maxOverlap = Math.min(overlap, cA.duration, cB.duration);
                            if (maxOverlap > cA.autoFadeOut) cA.autoFadeOut = maxOverlap;
                            if (maxOverlap > cB.autoFadeIn) cB.autoFadeIn = maxOverlap;
                        }
                    }
                }
            });
            // Mise à jour visuelle des ondes modifiées
            state.clips.forEach(c => updateClipVisuals(c));
        }

        DOM.fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            DOM.fileInput.value = '';

            const arrayBuffer = await file.arrayBuffer();
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

            const clip = {
                id: 'c_' + Date.now(), trackId: targetTrackIdForImport,
                name: file.name, buffer: audioBuffer,
                startTime: state.pauseTime, startOffset: 0, duration: audioBuffer.duration,
                fadeIn: 0, fadeOut: 0, gain: 1.0, autoFadeIn: 0, autoFadeOut: 0,
                sourceNode: null, fadeGainNode: null, clipGainNode: null, el: null
            };

            state.clips.push(clip);
            renderClipDOM(clip);
            updateCrossfades();
            updateWorkspaceWidth();
            saveState();
        });

        function renderClipDOM(clip) {
            const lane = DOM.tracksArea.querySelector(`.track-lane[data-track-id="${clip.trackId}"]`);
            if (!lane) return;
            const track = state.tracks.find(t => t.id === clip.trackId);

            const el = document.createElement('div');
            el.className = 'audio-clip'; el.id = clip.id; clip.el = el;
            el.style.height = `${track.height - 20}px`;

            const nameEl = document.createElement('div'); nameEl.className = 'clip-name'; nameEl.innerText = clip.name;
            const gainDisp = document.createElement('div'); gainDisp.className = 'clip-gain-display';
            const gainLine = document.createElement('div'); gainLine.className = 'clip-gain-line';

            // FIX: Wraps canvas in an overflow:hidden container to prevent ghosting visual after split
            const canvasContainer = document.createElement('div');
            canvasContainer.style.position = 'absolute';
            canvasContainer.style.inset = '0';
            canvasContainer.style.overflow = 'hidden';
            canvasContainer.style.pointerEvents = 'none';

            const canvas = document.createElement('canvas');
            canvas.className = 'clip-waveform';
            canvasContainer.appendChild(canvas);

            const hTrimL = document.createElement('div'); hTrimL.className = 'handle-trim left';
            const hTrimR = document.createElement('div'); hTrimR.className = 'handle-trim right';
            const hFadeL = document.createElement('div'); hFadeL.className = 'handle-fade left';
            const hFadeR = document.createElement('div'); hFadeR.className = 'handle-fade right';
            const pFadeL = document.createElement('div'); pFadeL.className = 'fade-poly left';
            const pFadeR = document.createElement('div'); pFadeR.className = 'fade-poly right';

            el.append(canvasContainer, nameEl, gainDisp, gainLine, pFadeL, pFadeR, hTrimL, hTrimR, hFadeL, hFadeR);
            lane.appendChild(el);

            drawWaveform(clip, canvas, track.height);
            updateClipVisuals(clip);

            let action = null; let startX = 0, startY = 0;
            let initStart = 0, initOffset = 0, initDur = 0, initFade = 0, initGain = 1;

            const onMouseDown = (e, act) => {
                e.stopPropagation();

                // Multi-selection logic
                if (act === 'move') {
                    if (e.shiftKey) {
                        selectClip(clip.id, true);
                    } else if (!state.selectedClipIds.includes(clip.id)) {
                        selectClip(clip.id, false);
                    }
                } else {
                    selectClip(clip.id, false);
                }

                action = act; startX = e.clientX; startY = e.clientY;
                initStart = clip.startTime; initOffset = clip.startOffset; initDur = clip.duration;
                initFade = (act === 'fade-left') ? clip.fadeIn : clip.fadeOut; initGain = clip.gain;

                if (act === 'move') {
                    state.dragInitialStates = state.selectedClipIds.map(id => {
                        const c = state.clips.find(x => x.id === id);
                        return { id, start: c.startTime, trackId: c.trackId };
                    });
                }

                if (act === 'gain') gainDisp.classList.add('show');
            };

            el.addEventListener('mousedown', (e) => onMouseDown(e, 'move'));
            hTrimL.addEventListener('mousedown', (e) => onMouseDown(e, 'trim-left'));
            hTrimR.addEventListener('mousedown', (e) => onMouseDown(e, 'trim-right'));
            hFadeL.addEventListener('mousedown', (e) => onMouseDown(e, 'fade-left'));
            hFadeR.addEventListener('mousedown', (e) => onMouseDown(e, 'fade-right'));
            gainLine.addEventListener('mousedown', (e) => onMouseDown(e, 'gain'));

            const onMouseMove = (e) => {
                if (!action) return;
                const deltaX = (e.clientX - startX) / state.pixelsPerSecond;
                const deltaY = e.clientY - startY;

                if (action === 'move') {
                    // Logic for primary clip snap
                    const primaryInit = state.dragInitialStates.find(st => st.id === clip.id);
                    let targetStart = Math.max(0, primaryInit.start + deltaX);
                    let snappedStart = getSnapTime(targetStart, clip.id);
                    let actualDeltaX = snappedStart - primaryInit.start;

                    // Vertical track drag logic
                    const rect = DOM.tracksArea.getBoundingClientRect();
                    const yPos = e.clientY - rect.top;
                    let accumH = 0; let newTrackId = state.tracks[0].id;
                    for (let i = 0; i < state.tracks.length; i++) {
                        accumH += state.tracks[i].height;
                        if (yPos < accumH) { newTrackId = state.tracks[i].id; break; }
                    }

                    let trackIdxOffset = 0;
                    if (primaryInit) {
                        const primaryOldIdx = state.tracks.findIndex(t => t.id === primaryInit.trackId);
                        const newTrackIdx = state.tracks.findIndex(t => t.id === newTrackId);
                        trackIdxOffset = newTrackIdx - primaryOldIdx;
                    }

                    // Apply to all selected clips
                    state.dragInitialStates.forEach(st => {
                        const c = state.clips.find(x => x.id === st.id);
                        if (!c) return;

                        let nStart = st.start + actualDeltaX;
                        if (nStart < 0) nStart = 0;
                        c.startTime = nStart;

                        let oldTIdx = state.tracks.findIndex(t => t.id === st.trackId);
                        let targetTIdx = oldTIdx + trackIdxOffset;
                        targetTIdx = Math.max(0, Math.min(targetTIdx, state.tracks.length - 1));
                        const targetTrack = state.tracks[targetTIdx];

                        if (c.trackId !== targetTrack.id) {
                            c.trackId = targetTrack.id;
                            const newLane = DOM.tracksArea.querySelector(`.track-lane[data-track-id="${targetTrack.id}"]`);
                            if (newLane && c.el) {
                                newLane.appendChild(c.el);
                                c.el.style.height = `${targetTrack.height - 20}px`;
                                drawWaveform(c, c.el.querySelector('.clip-waveform'), targetTrack.height);
                            }
                        }
                        updateClipVisuals(c);
                    });
                }
                else if (action === 'gain') {
                    let newGain = initGain - (deltaY / 50);
                    clip.gain = Math.max(0, Math.min(newGain, 5.0));
                }
                else if (action === 'trim-left') {
                    let rawStart = initStart + deltaX;
                    let snappedStart = getSnapTime(rawStart, clip.id);
                    let actualDeltaX = snappedStart - initStart;

                    if (initOffset + actualDeltaX < 0) actualDeltaX = -initOffset;
                    if (initDur - actualDeltaX < 0.1) actualDeltaX = initDur - 0.1;

                    clip.startOffset = initOffset + actualDeltaX;
                    clip.duration = initDur - actualDeltaX;
                    clip.startTime = initStart + actualDeltaX;
                    if (clip.fadeIn > clip.duration) clip.fadeIn = clip.duration;
                    if (clip.fadeOut > clip.duration) clip.fadeOut = clip.duration;
                }
                else if (action === 'trim-right') {
                    let rawEnd = initStart + initDur + deltaX;
                    let snappedEnd = getSnapTime(rawEnd, clip.id);
                    let actualDeltaX = snappedEnd - (initStart + initDur);

                    let d = actualDeltaX;
                    const maxDur = clip.buffer.duration - clip.startOffset;
                    if (initDur + d > maxDur) d = maxDur - initDur;
                    if (initDur + d < 0.1) d = 0.1 - initDur;

                    clip.duration = initDur + d;
                    if (clip.fadeIn > clip.duration) clip.fadeIn = clip.duration;
                    if (clip.fadeOut > clip.duration) clip.fadeOut = clip.duration;
                }
                else if (action === 'fade-left') {
                    let f = initFade + deltaX;
                    clip.fadeIn = Math.max(0, Math.min(f, clip.duration - clip.fadeOut));
                }
                else if (action === 'fade-right') {
                    let f = initFade - deltaX;
                    clip.fadeOut = Math.max(0, Math.min(f, clip.duration - clip.fadeIn));
                }

                if (action !== 'move') updateClipVisuals(clip);
                updateCrossfades();
                if (action !== 'gain' && action !== 'fade-left' && action !== 'fade-right') updateWorkspaceWidth();
            };

            const onMouseUp = () => {
                if (action) {
                    if (action === 'gain') gainDisp.classList.remove('show');
                    action = null;
                    DOM.snapInd.style.opacity = 0;
                    saveState();
                }
            };
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        }

        function drawWaveform(clip, canvas, trackHeight) {
            const dpr = window.devicePixelRatio || 1;
            const cssWidth = clip.buffer.duration * state.pixelsPerSecond;
            const cssHeight = trackHeight - 20;

            canvas.style.width = `${cssWidth}px`;
            canvas.style.height = `${cssHeight}px`;

            const internalWidth = Math.min(Math.floor(cssWidth * dpr), 16384);
            canvas.width = internalWidth;
            canvas.height = Math.floor(cssHeight * dpr);

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const data = clip.buffer.getChannelData(0);
            const step = Math.max(1, Math.floor(data.length / internalWidth));
            const amp = canvas.height / 2;

            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            ctx.fillStyle = isDark ? 'rgba(255, 255, 255, 0.8)' : 'rgba(0, 0, 0, 0.7)';

            for (let i = 0; i < internalWidth; i++) {
                let min = 1.0; let max = -1.0;
                const offset = i * step;
                const limit = Math.min(offset + step, data.length);
                for (let j = offset; j < limit; j++) {
                    const datum = data[j];
                    if (datum < min) min = datum;
                    if (datum > max) max = datum;
                }
                if (min > max) { min = 0; max = 0; }
                const y = Math.round(amp - (max * amp));
                const h = Math.max(1, Math.round((max - min) * amp));
                ctx.fillRect(i, y, 1, h);
            }
        }

        function updateClipVisuals(clip) {
            if (!clip.el) return;
            clip.el.style.left = `${clip.startTime * state.pixelsPerSecond}px`;
            clip.el.style.width = `${clip.duration * state.pixelsPerSecond}px`;

            const effFadeIn = Math.max(clip.fadeIn || 0, clip.autoFadeIn || 0);
            const effFadeOut = Math.max(clip.fadeOut || 0, clip.autoFadeOut || 0);

            const inPx = effFadeIn * state.pixelsPerSecond;
            const outPx = effFadeOut * state.pixelsPerSecond;

            clip.el.querySelector('.handle-fade.left').style.left = `${inPx - 4}px`;
            const pLeft = clip.el.querySelector('.fade-poly.left');
            pLeft.style.width = `${inPx}px`;
            if ((clip.autoFadeIn || 0) > (clip.fadeIn || 0)) pLeft.classList.add('auto-fade'); else pLeft.classList.remove('auto-fade');

            clip.el.querySelector('.handle-fade.right').style.right = `${outPx - 4}px`;
            const pRight = clip.el.querySelector('.fade-poly.right');
            pRight.style.width = `${outPx}px`;
            if ((clip.autoFadeOut || 0) > (clip.fadeOut || 0)) pRight.classList.add('auto-fade'); else pRight.classList.remove('auto-fade');

            let percent;
            if (clip.gain <= 1) percent = 100 - (clip.gain * 50);
            else percent = 50 - ((clip.gain - 1) / 4 * 50);

            clip.el.querySelector('.clip-gain-line').style.top = `${percent}%`;

            const gainDisp = clip.el.querySelector('.clip-gain-display');
            if (gainDisp) gainDisp.innerText = `GAIN: ${(clip.gain * 100).toFixed(0)}%`;

            const canvas = clip.el.querySelector('.clip-waveform');
            canvas.style.transform = `scaleY(${clip.gain})`;
            canvas.style.left = `-${clip.startOffset * state.pixelsPerSecond}px`;
        }

        function selectClip(id, multi = false) {
            if (!id) {
                state.selectedClipIds = [];
            } else if (multi) {
                if (state.selectedClipIds.includes(id)) {
                    state.selectedClipIds = state.selectedClipIds.filter(i => i !== id);
                } else {
                    state.selectedClipIds.push(id);
                }
            } else {
                if (!state.selectedClipIds.includes(id)) {
                    state.selectedClipIds = [id];
                }
            }
            document.querySelectorAll('.audio-clip').forEach(el => el.classList.remove('selected'));
            state.selectedClipIds.forEach(cid => {
                const el = document.getElementById(cid);
                if (el) el.classList.add('selected');
            });
        }

        function scheduleClipPlayback(clip, ctx) {
            const source = ctx.createBufferSource();
            source.buffer = clip.buffer;

            const fadeGain = ctx.createGain();
            const clipGain = ctx.createGain();
            clipGain.gain.value = clip.gain;

            const track = state.tracks.find(t => t.id === clip.trackId);
            if (!track || !track.gainNode) return;

            source.connect(fadeGain);
            fadeGain.connect(clipGain);
            clipGain.connect(track.gainNode);

            if (ctx === audioCtx) {
                clip.sourceNode = source; clip.fadeGainNode = fadeGain; clip.clipGainNode = clipGain;
            }

            const ctxTime = ctx.currentTime;
            const timeToStart = clip.startTime - state.pauseTime;
            let delay = timeToStart; let playOffset = clip.startOffset; let playDuration = clip.duration;

            if (timeToStart < 0) {
                const passed = Math.abs(timeToStart);
                if (passed >= playDuration) return;
                playOffset += passed; playDuration -= passed; delay = 0;
            }

            const absStart = ctxTime + delay;
            const absEnd = absStart + playDuration;

            const effFadeIn = Math.max(clip.fadeIn || 0, clip.autoFadeIn || 0);
            const effFadeOut = Math.max(clip.fadeOut || 0, clip.autoFadeOut || 0);

            fadeGain.gain.setValueAtTime(0, ctxTime);
            const trueStart = absStart - (timeToStart < 0 ? Math.abs(timeToStart) : 0);
            const fadeInEnd = trueStart + effFadeIn;
            const fadeOutStart = trueStart + clip.duration - effFadeOut;

            if (timeToStart >= 0) {
                fadeGain.gain.setValueAtTime(0, absStart);
                if (effFadeIn > 0) fadeGain.gain.linearRampToValueAtTime(1, fadeInEnd);
                else fadeGain.gain.setValueAtTime(1, absStart);
            } else {
                if (ctxTime < fadeInEnd) {
                    const currentVol = (ctxTime - trueStart) / effFadeIn;
                    fadeGain.gain.setValueAtTime(currentVol, ctxTime);
                    fadeGain.gain.linearRampToValueAtTime(1, fadeInEnd);
                } else { fadeGain.gain.setValueAtTime(1, ctxTime); }
            }

            if (ctxTime < fadeOutStart) {
                fadeGain.gain.setValueAtTime(1, fadeOutStart);
                fadeGain.gain.linearRampToValueAtTime(0, absEnd);
            } else if (ctxTime < absEnd) {
                const currentVol = 1 - ((ctxTime - fadeOutStart) / effFadeOut);
                fadeGain.gain.setValueAtTime(currentVol, ctxTime);
                fadeGain.gain.linearRampToValueAtTime(0, absEnd);
            }

            source.start(absStart, playOffset, playDuration);
        }

        function play() {
            initAudio();
            if (state.isPlaying) return;
            state.isPlaying = true;
            state.playbackStartTime = audioCtx.currentTime - state.pauseTime;
            state.clips.forEach(clip => scheduleClipPlayback(clip, audioCtx));

            DOM.btnUndo.classList.add('playing');
            document.getElementById('btn-play').classList.add('playing');
            document.getElementById('btn-pause').classList.remove('paused');
            animationLoop();
        }

        function pause() {
            if (!state.isPlaying) return;
            state.isPlaying = false;
            state.pauseTime = audioCtx.currentTime - state.playbackStartTime;
            stopAllNodes();
            cancelAnimationFrame(state.animationId);

            document.getElementById('btn-play').classList.remove('playing');
            document.getElementById('btn-pause').classList.add('paused');
        }

        function stop() {
            state.isPlaying = false;
            state.pauseTime = 0;
            stopAllNodes();
            cancelAnimationFrame(state.animationId);
            updatePlayheadUI(0);

            document.getElementById('btn-play').classList.remove('playing');
            document.getElementById('btn-pause').classList.remove('paused');
        }

        function stopAllNodes() {
            state.clips.forEach(clip => {
                if (clip.sourceNode) { try { clip.sourceNode.stop(); } catch (e) { } clip.sourceNode.disconnect(); }
                if (clip.fadeGainNode) clip.fadeGainNode.disconnect();
                if (clip.clipGainNode) clip.clipGainNode.disconnect();
                clip.sourceNode = null; clip.fadeGainNode = null; clip.clipGainNode = null;
            });
        }

        function seek(timeInSeconds) {
            initAudio();
            const wasPlaying = state.isPlaying;
            if (wasPlaying) pause();
            state.pauseTime = Math.max(0, timeInSeconds);
            updatePlayheadUI(state.pauseTime);
            if (wasPlaying) play();
        }

        let isScrubbing = false;
        let wasPlayingBeforeScrub = false;

        function scrub(e) {
            const rect = DOM.tracksArea.getBoundingClientRect();
            let clickX = e.clientX - rect.left + DOM.timelineContainer.scrollLeft;
            if (clickX < 0) clickX = 0;
            state.pauseTime = clickX / state.pixelsPerSecond;
            updatePlayheadUI(state.pauseTime);
        }

        function startScrub(e) {
            initAudio();
            isScrubbing = true;
            wasPlayingBeforeScrub = state.isPlaying;
            if (state.isPlaying) pause();
            scrub(e);
        }

        DOM.ruler.addEventListener('mousedown', startScrub);
        // Playhead can now be clicked directly anywhere due to pointer-events: auto
        DOM.playhead.addEventListener('mousedown', startScrub);

        document.addEventListener('mousemove', (e) => {
            if (isScrubbing) scrub(e);
        });

        document.addEventListener('mouseup', () => {
            if (isScrubbing) {
                isScrubbing = false;
                if (wasPlayingBeforeScrub) play();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;

            if (e.code === 'Space') {
                e.preventDefault(); state.isPlaying ? pause() : play();
            } else if (e.code === 'KeyS') {
                splitSelected();
            } else if (e.code === 'Delete' || e.code === 'Backspace') {
                deleteSelected();
            } else if (e.code === 'ArrowLeft') {
                e.preventDefault(); seek(state.pauseTime - 0.1);
            } else if (e.code === 'ArrowRight') {
                e.preventDefault(); seek(state.pauseTime + 0.1);
            } else if (e.code === 'KeyZ' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault(); undo();
            } else if (e.code === 'KeyY' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault(); redo();
            }
        });

        function splitSelected() {
            if (state.selectedClipIds.length === 0) return;
            const pt = state.pauseTime;
            let didSplit = false;
            const wasPlaying = state.isPlaying;
            if (wasPlaying) pause();

            let newSel = [];

            state.selectedClipIds.forEach(id => {
                const idx = state.clips.findIndex(c => c.id === id);
                if (idx === -1) return;
                const orig = state.clips[idx];

                if (pt > orig.startTime && pt < (orig.startTime + orig.duration)) {
                    didSplit = true;
                    const cutOffset = pt - orig.startTime;
                    const newClip = {
                        ...orig, id: 'c_' + Date.now() + Math.random(),
                        startTime: pt, startOffset: orig.startOffset + cutOffset, duration: orig.duration - cutOffset,
                        fadeIn: 0, sourceNode: null, fadeGainNode: null, clipGainNode: null, el: null
                    };

                    orig.duration = cutOffset; orig.fadeOut = 0;
                    if (orig.fadeIn > orig.duration) orig.fadeIn = orig.duration;
                    updateClipVisuals(orig);

                    state.clips.push(newClip); renderClipDOM(newClip);
                    newSel.push(newClip.id);
                } else {
                    newSel.push(id);
                }
            });

            if (didSplit) {
                state.selectedClipIds = newSel;
                state.selectedClipIds.forEach(cid => document.getElementById(cid)?.classList.add('selected'));
                updateCrossfades();
                saveState();
            }
            if (wasPlaying) play();
        }

        function deleteSelected() {
            if (state.selectedClipIds.length === 0) return;
            state.selectedClipIds.forEach(id => {
                const idx = state.clips.findIndex(c => c.id === id);
                if (idx !== -1) {
                    const clip = state.clips[idx];
                    if (clip.sourceNode) { try { clip.sourceNode.stop(); } catch (e) { } }
                    if (clip.el) clip.el.remove();
                    state.clips.splice(idx, 1);
                }
            });
            state.selectedClipIds = [];
            updateCrossfades();
            saveState();
        }

        function animationLoop() {
            if (!state.isPlaying) return;
            state.pauseTime = audioCtx.currentTime - state.playbackStartTime;
            updatePlayheadUI(state.pauseTime);

            const px = state.pauseTime * state.pixelsPerSecond;
            if (px > DOM.timelineContainer.scrollLeft + DOM.timelineContainer.clientWidth - 50) {
                DOM.timelineContainer.scrollLeft = px - DOM.timelineContainer.clientWidth + 100;
            }
            state.animationId = requestAnimationFrame(animationLoop);
        }

        function updatePlayheadUI(time) {
            DOM.playhead.style.left = `${time * state.pixelsPerSecond}px`;
            const m = Math.floor(time / 60).toString().padStart(2, '0');
            const s = Math.floor(time % 60).toString().padStart(2, '0');
            const ms = Math.floor((time % 1) * 10);
            DOM.timeDisplay.innerText = `${m}:${s}.${ms}`;
        }

        function updateWorkspaceWidth() {
            let max = 60;
            state.clips.forEach(c => { if (c.startTime + c.duration > max) max = c.startTime + c.duration; });
            DOM.tracksArea.style.minWidth = `${(max + 10) * state.pixelsPerSecond}px`;
        }

        function startVUMeter() {
            const data = new Uint8Array(analyser.frequencyBinCount);
            const warningEl = document.getElementById('clip-warning');
            const canvas = DOM.canvasVU;

            const dpr = window.devicePixelRatio || 1;
            canvas.width = 12 * dpr;
            canvas.height = canvas.clientHeight * dpr;

            function draw() {
                requestAnimationFrame(draw);
                analyser.getByteFrequencyData(data);

                let sum = 0; let maxPeak = 0;
                for (let i = 0; i < data.length; i++) {
                    sum += data[i];
                    if (data[i] > maxPeak) maxPeak = data[i];
                }

                const avgVol = Math.min(100, (sum / data.length / 128) * 100);

                if (maxPeak > 250) { warningEl.classList.add('active'); clipHoldTime = Date.now(); }
                else if (Date.now() - clipHoldTime > 1500) { warningEl.classList.remove('active'); }

                ctxVU.clearRect(0, 0, canvas.width, canvas.height);

                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                ctxVU.fillStyle = isDark ? '#FFFFFF' : '#000000';

                let fillHeight = (avgVol / 100) * canvas.height;
                if (maxPeak > 240) {
                    fillHeight = Math.max(fillHeight, canvas.height * 0.95);
                    ctxVU.fillStyle = 'var(--accent)';
                }

                ctxVU.fillRect(0, canvas.height - fillHeight, canvas.width, fillHeight);
            }
            draw();
        }

        document.getElementById('btn-theme').onclick = () => {
            const html = document.documentElement;
            html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
            setTimeout(() => {
                startVUMeter();
                state.clips.forEach(c => {
                    const trk = state.tracks.find(t => t.id === c.trackId);
                    if (trk) drawWaveform(c, c.el.querySelector('.clip-waveform'), trk.height);
                });
            }, 50);
        };

        DOM.btnUndo.onclick = undo;
        DOM.btnRedo.onclick = redo;

        function setZoom(factor) {
            let newZoom = state.pixelsPerSecond * factor;
            newZoom = Math.max(10, Math.min(newZoom, 400));
            if (newZoom === state.pixelsPerSecond) return;
            state.pixelsPerSecond = newZoom;

            updatePlayheadUI(state.pauseTime);
            state.clips.forEach(clip => {
                updateClipVisuals(clip);
                const trk = state.tracks.find(t => t.id === clip.trackId);
                drawWaveform(clip, clip.el.querySelector('.clip-waveform'), trk.height);
            });
            updateWorkspaceWidth();
        }

        document.getElementById('btn-zoom-in').onclick = () => setZoom(1.3);
        document.getElementById('btn-zoom-out').onclick = () => setZoom(1 / 1.3);
        document.getElementById('btn-play').onclick = play;
        document.getElementById('btn-pause').onclick = pause;
        document.getElementById('btn-stop').onclick = stop;

        document.getElementById('btn-export').addEventListener('click', async () => {
            if (state.clips.length === 0) { alert("Le montage est vide !"); return; }
            if (state.isPlaying) stop();

            const btn = document.getElementById('btn-export');
            btn.innerHTML = "EXPORTING...";
            btn.disabled = true;

            let maxDur = 0;
            state.clips.forEach(c => { if (c.startTime + c.duration > maxDur) maxDur = c.startTime + c.duration; });
            maxDur += 1;

            const offlineCtx = new OfflineAudioContext(2, audioCtx.sampleRate * maxDur, audioCtx.sampleRate);

            const anySolo = state.tracks.some(t => t.solo);
            state.tracks.forEach(t => {
                t.offlineGainNode = offlineCtx.createGain();
                let targetVol = t.volume;
                if (t.muted) targetVol = 0;
                if (anySolo && !t.solo) targetVol = 0;
                t.offlineGainNode.gain.value = targetVol;
                t.offlineGainNode.connect(offlineCtx.destination);
            });

            state.pauseTime = 0;
            state.clips.forEach(clip => {
                const track = state.tracks.find(t => t.id === clip.trackId);
                if (track) {
                    const originalNode = track.gainNode;
                    track.gainNode = track.offlineGainNode;
                    scheduleClipPlayback(clip, offlineCtx);
                    track.gainNode = originalNode;
                }
            });

            try {
                const renderedBuffer = await offlineCtx.startRendering();
                const wavBlob = bufferToWave(renderedBuffer, renderedBuffer.length);
                const a = document.createElement('a');
                a.href = URL.createObjectURL(wavBlob);
                a.download = 'Montage_Podcast.wav';
                a.click();
            } catch (e) { alert("Erreur d'exportation."); }

            btn.innerHTML = 'EXPORT MIX';
            btn.disabled = false;
        });

        function bufferToWave(abuffer, len) {
            let numOfChan = abuffer.numberOfChannels, length = len * numOfChan * 2 + 44,
                buffer = new ArrayBuffer(length), view = new DataView(buffer),
                channels = [], i, sample, offset = 0, pos = 0;

            function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

            setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
            setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
            setUint32(abuffer.sampleRate); setUint32(abuffer.sampleRate * 2 * numOfChan);
            setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164); setUint32(length - pos - 4);

            for (i = 0; i < abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));

            while (pos < length) {
                for (i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
                    view.setInt16(pos, sample, true); pos += 2;
                }
                offset++;
            }
            return new Blob([buffer], { type: "audio/wav" });
        }

        renderTracksDOM();
    </script>
</body>
